[project]
name = "dvf"
version = "0.1.0"
description = "Differentiable moving-Voronoi-mesh Euler solver in JAX"
requires-python = ">=3.11"
dependencies = [
    "jax==0.9.2",
    "numpy",
    "scipy",
]

[dependency-groups]
dev = ["pytest", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dvf"]

[tool.ruff]
line-length = 100
